name: FasterXML Jackson Examples CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "**.java"
      - "**.xml"
      - "**.yml"
      - "**.yaml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"
          cache: maven

      - name: Build and Test with Maven
        run: ./mvnw -B verify
